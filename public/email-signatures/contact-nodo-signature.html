<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nodo Email Signature</title>
  </head>
  <body style="margin: 0; padding: 24px; background: #ffffff">
    <table
      cellpadding="0"
      cellspacing="0"
      role="presentation"
      style="
        width: 100%;
        max-width: 520px;
        border-collapse: collapse;
        font-family: Arial, Helvetica, sans-serif;
        color: #050505;
      "
    >
      <tr>
        <td style="padding: 0 0 14px 0">
          <img
            src="https://nodo.co.nz/brand/nodo-logo-white.png"
            width="132"
            alt="Nodo"
            style="display: block; width: 132px; height: auto; border: 0; outline: none; text-decoration: none"
          />
        </td>
      </tr>
      <tr>
        <td style="padding: 0 0 16px 0">
          <div style="font-size: 18px; line-height: 22px; font-weight: 700; color: #050505">Miguel Hernandez</div>
          <div style="font-size: 13px; line-height: 20px; font-weight: 700; color: #7c3aed; letter-spacing: 0.02em">
            Clarity.Speed.Results.
          </div>
        </td>
      </tr>
      <tr>
        <td style="padding: 14px 0 0 0; border-top: 1px solid #e8e5ef">
          <table cellpadding="0" cellspacing="0" role="presentation" style="border-collapse: collapse">
            <tr>
              <td style="padding: 0 12px 6px 0; font-size: 12px; line-height: 18px; font-weight: 700; color: #050505">
                Email
              </td>
              <td style="padding: 0 0 6px 0; font-size: 12px; line-height: 18px; color: #4b4656">
                <a href="mailto:contact@nodo.co.nz" style="color: #4b4656; text-decoration: none">
                  contact@nodo.co.nz
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 12px 6px 0; font-size: 12px; line-height: 18px; font-weight: 700; color: #050505">
                Phone
              </td>
              <td style="padding: 0 0 6px 0; font-size: 12px; line-height: 18px; color: #4b4656">
                <a href="tel:+64277423001" style="color: #4b4656; text-decoration: none"> +64 27 742 3001 </a>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 12px 0 0; font-size: 12px; line-height: 18px; font-weight: 700; color: #050505">
                Location
              </td>
              <td style="padding: 0; font-size: 12px; line-height: 18px; color: #4b4656">
                23 Orton Street, Glenfield, Auckland 0627
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
